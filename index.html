<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Гонки 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="hud-top-left">
    <div id="hud-lap">Lap 1/3</div>
    <div id="hud-minimap"><div class="minimap-cross"></div></div>
  </div>

  <div id="hud-top-right">
    <div class="hud-timer-row">Last Lap <span id="last-lap">00:00:000</span></div>
    <div class="hud-timer-row">Best Lap <span id="best-lap">00:00:000</span></div>
    <div class="hud-timer-row">Lap <span id="lap-time">00:00:000</span></div>
    <div class="hud-timer-row">Race <span id="race-time">00:00:000</span></div>
  </div>

  <div id="hud-bottom-left">
    <div id="hud-position"><span class="pos-text">1st</span> <span class="pos-arrow">▲</span></div>
    <div id="hud-driver">
      <div class="driver-gap">+0m</div>
      <div class="driver-name">Player<br>Pilot</div>
    </div>
  </div>

  <div id="hud-bottom-right">
    <div id="hud-speed-dots">
      <div class="dot" id="dot-0"></div>
      <div class="dot" id="dot-1"></div>
      <div class="dot" id="dot-2"></div>
      <div class="dot" id="dot-3"></div>
      <div class="dot" id="dot-4"></div>
      <div class="dot" id="dot-5"></div>
    </div>
    <div id="hud-speed"><span id="speed-val">0</span> mph</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <h1 id="overlay-title">Гонки 3D</h1>
  <p id="overlay-text">Управление: ← → или A / D<br>Избегай столкновений!</p>
  <button id="start-btn" type="button">Начать игру</button>
</div>

<div id="touch-controls">
  <button id="left-btn" type="button">◀</button>
  <button id="right-btn" type="button">▶</button>
</div>

<div id="load-error"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
